; The Depth add-on's manifest, which its release has and Unishade writes to the add-on's folder when it installs the
; add-on. Version is the add-on's own, apart from Unishade's: 1.2.0, or 1.2.0-beta.3 for a beta. Raising it is what
; releases the add-on again, as CONTRIBUTING.md says.

[Addon]
Id=unishade.depth
Name=Depth
Version=1.0.0-beta.1
Author=Unishade
Description=Estimates how far everything in the game's picture is, for effects that use depth.
Icon=icon.png
Website=https://unishade.me/docs/add-ons/
License=MIT
Api=1

[windows-x64]
Library=Depth.dll

[macos-arm64]
Library=Depth.dylib
