; The Depth add-on's files, for each system it runs on. Unishade's Add-ons page downloads them into the add-on's
; folder, and installs the add-on only when every one has the SHA-256 listed here.
;
; Each section is named after a system, as src/addons/addon_manifest.h names them. Its keys are the add-on's files, by
; their path in its folder, each set to the file's SHA-256 and the address it downloads from. The add-on's addon.ini
; and icon are not among them: Unishade takes them from the release. cmake/addon_release.cmake packs the release, and
; puts the SHA-256 of each library this repository builds in place of @its file name@, and the release's tag in place
; of @TAG@.

