; The example add-on's manifest. Copy the folder, change every line here, and Unishade lists your add-on.

[Addon]
Id=unishade.example
Name=Example
Version=1.0.0
Author=Unishade
Description=Shows what an add-on can do: settings, controls of its own, drawing over the game, events and Unishade's functions.
Website=https://unishade.me/developers/
License=MIT
Api=1

[windows]
Library=Example.dll

[macos]
Library=Example.dylib

[linux]
Library=Example.so
