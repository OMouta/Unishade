; The DLSS5 add-on's manifest. The build puts the version in place of @VERSION@ and the manifest into Unishade, which
; writes it to the add-on's folder when it installs the add-on.

[Addon]
Id=unishade.dlss5
Name=DLSS5
Version=@VERSION@
Author=Unishade
Description=NVIDIA's DLSS neural rendering on the game's picture. Needs an NVIDIA RTX graphics card.
Icon=icon.png
Website=https://unishade.me/docs/add-ons/
License=MIT
Api=2

[windows-x64]
Library=Unishade_nvngx.dll
