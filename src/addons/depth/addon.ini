; The Depth add-on's manifest. The build puts the version in place of @VERSION@ and the manifest into Unishade, which
; writes it to the add-on's folder when it installs the add-on.

[Addon]
Id=unishade.depth
Name=Depth
Version=@VERSION@
Author=Unishade
Description=Estimates how far everything in the game's picture is, for effects that use depth.
Icon=icon.png
Website=https://unishade.me/docs/add-ons/
License=MIT
Api=2

[windows-x64]
Library=Depth.dll

[macos-arm64]
Library=Depth.dylib
