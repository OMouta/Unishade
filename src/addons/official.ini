; Official add-ons. One whose SHA-256 is here loads without asking, and the Add-ons page offers to install them.
;
; Each section is an add-on, named as Unishade shows it. Its keys are its files, by their path in the Addons folder,
; each set to the file's SHA-256 and the address it downloads from. The file directly in the Addons folder is the
; add-on itself, for the system its extension is for. The build puts the SHA-256 of each add-on it builds in place of
; @its file name@, and the version in place of @VERSION@.
