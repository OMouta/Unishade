name: Build and release

on:
  push:
    branches: ['**']
  pull_request:
  # Manual runs are signed by SignPath. With release on, they're signed with the release certificate and published as
  # the version in CMakeLists.txt. When UNISHADE_BETA there makes it a beta, release publishes it as a prerelease
  # instead, which is not signed. Without release, they're signed with the test certificate, to try the signing.
  # The Mac app is signed with the Developer ID certificate and notarized by Apple on every manual run, a beta's too.
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    # SignPath reads the run's jobs and downloads the unsigned files with the workflow's token.
    permissions:
      actions: read
      contents: read
    env:
      SIGNPATH_ORGANIZATION_ID: 163ddba1-cfa2-4731-ab5b-79be8ba21487
      SIGNPATH_PROJECT: Unishade
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # project(Unishade VERSION x.y.z) and set(UNISHADE_BETA n) set the version the files report and name the release:
      # x.y.z, or x.y.z-beta.n when n is not 0. A release is checked here, so a mistake fails before anyone is asked to
      # approve the signing. The steps that sign run when sign is true: on every manual run but the release of a beta.
      - name: Read the version
        id: version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(sed -nE 's/.*project\(Unishade VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | sort -u)
          beta=$(sed -nE 's/^set\(UNISHADE_BETA (0|[1-9][0-9]*)\).*/\1/p' CMakeLists.txt)
          # A line this can't read must not release a beta as the version itself.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$beta" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read project(Unishade VERSION x.y.z) and set(UNISHADE_BETA n) from CMakeLists.txt."
            exit 1
          fi
          raise="project(Unishade VERSION $version)"
          if [ "$beta" != 0 ]; then
            version="$version-beta.$beta"
            raise="set(UNISHADE_BETA $beta)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" != true ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$beta" = 0 ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
          # A beta can come from the branch its version is made on.
          if [ "$beta" = 0 ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Raise $raise in CMakeLists.txt."
            exit 1
          fi
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # Setup embeds Unishade.exe, so the program is signed first, and Setup is built and signed after it. The add-ons
      # are not part of a release of Unishade: addon.yml releases each on its own.
      - name: Upload the program for signing
        id: unsigned-program
        if: steps.version.outputs.sign == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-program
          path: build/Release/Unishade.exe
          if-no-files-found: error
      - name: Sign the program
        if: steps.version.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.release && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-program.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          # Release signing waits for an approver.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/Release
      - name: Build installer
        run: cmake --build build --config Release --target installer
      # Building Setup must not have relinked the signed program, or the release would have an unsigned copy.
      - name: Check Setup embedded the signed program
        if: steps.version.outputs.sign == 'true'
        shell: pwsh
        run: |
          if (-not (Get-AuthenticodeSignature build/Release/Unishade.exe).SignerCertificate) { throw "Unishade.exe isn't signed anymore." }
      - name: Upload Setup for signing
        id: unsigned-setup
        if: steps.version.outputs.sign == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-setup
          path: build/installer/Unishade-Setup-*.exe
          if-no-files-found: error
      - name: Sign Setup
        if: steps.version.outputs.sign == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.release && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/installer
      # Installs into fresh folders under build/installer-tests with --portable, so nothing is registered on the runner.
      # Unishade downloads every effect package, and the presets from this commit, so a pull request that changes a
      # preset is tested with it.
      - name: Test installer
        timeout-minutes: 40
        shell: pwsh
        env:
          PRESETS_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/presets
        run: ./tests/installer_tests.ps1 -Setup (Get-Item build/installer/Unishade-Setup-*.exe).FullName -PresetsBaseUrl $env:PRESETS_URL
      - name: Upload the installer test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-test-logs
          path: build/installer-tests/**/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unishade-windows-x64
          path: |
            build/Release/Unishade.exe
            build/Release/Depth.dll
            build/Release/Unishade_nvngx.dll
            build/installer/Unishade-Setup-*.exe
            LICENSE
          if-no-files-found: error

  # Built on the oldest supported runner, so the binary runs on older distributions too.
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev libx11-dev libxcomposite-dev libxext-dev libxres-dev libxdamage-dev \
            libxcb-dri3-dev libx11-xcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-vulkan-drivers
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Renders the repository's presets on Mesa's software Vulkan driver, with the packages they use.
      - name: Render presets
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          shaders="$XDG_DATA_HOME/unishade/reshade-shaders"
          mkdir -p "$shaders/Shaders" "$shaders/Textures"
          # Each package at a fixed commit, so a change upstream can't change the result.
          fetch() {
            git init --quiet "$RUNNER_TEMP/package"
            git -C "$RUNNER_TEMP/package" fetch --quiet --depth 1 "$1" "$3"
            git -C "$RUNNER_TEMP/package" checkout --quiet FETCH_HEAD
            mkdir -p "$shaders/Shaders/$2" "$shaders/Textures/$2"
            cp -r "$RUNNER_TEMP"/package/Shaders/. "$shaders/Shaders/$2"
            if [ -d "$RUNNER_TEMP/package/Textures" ]; then cp -r "$RUNNER_TEMP"/package/Textures/. "$shaders/Textures/$2"; fi
            rm -rf "$RUNNER_TEMP/package"
          }
          fetch https://github.com/crosire/reshade-shaders "" fd0022170615ce0d8162d219bff07232fa6dd84f # slim
          fetch https://github.com/crosire/reshade-shaders "" bcb5ba54199f4455026dd8ba66dc1b74461d3152 # legacy
          fetch https://github.com/CeeJayDK/SweetFX "" 93ddf39b357f5da534ed6d34ba4ec8cc7dcfa361 # master
          fetch https://github.com/luluco250/FXShaders FXShaders 76365e35c48e30170985ca371e67d8daf8eb9a98 # master
          fetch https://github.com/BlueSkyDefender/AstrayFX AstrayFX 59bae8b33e34f37a8e521e666864085ccbf08535 # master
          # A real game picture from the repository's own screenshots.
          for preset in presets/GenericPreset*.ini; do
            ./build/unishade --render assets/ReadmeShowcase1.jpg "$preset" "$(basename "$preset" .ini).png"
          done
          # Frames handed over on the graphics card, as zero-copy capture does, must come out the same as frames
          # copied through memory. These effects use no timer or randomness, so the results match exactly.
          printf 'Techniques=\n' > "$RUNNER_TEMP/copy.ini"
          printf 'Techniques=Curves@Curves.fx,LumaSharpen@LumaSharpen.fx,Vibrance@Vibrance.fx\n' > "$RUNNER_TEMP/fixed.ini"
          for preset in copy fixed; do
            ./build/unishade --render assets/ReadmeShowcase1.jpg "$RUNNER_TEMP/$preset.ini" "$RUNNER_TEMP/$preset-memory.png"
            ./build/unishade --render assets/ReadmeShowcase1.jpg "$RUNNER_TEMP/$preset.ini" "$RUNNER_TEMP/$preset-gpu.png" --gpu-source
            cmp "$RUNNER_TEMP/$preset-memory.png" "$RUNNER_TEMP/$preset-gpu.png"
          done
      - name: Package
        run: |
          mkdir -p package/Unishade
          cp build/unishade LICENSE CREDITS.txt package/Unishade/
          tar -czf Unishade-linux-x64.tar.gz -C package Unishade
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unishade-linux-x64
          path: |
            Unishade-linux-x64.tar.gz
            GenericPreset*.png
          if-no-files-found: error

  build-macos:
    runs-on: macos-26
    # A manual run waits for Apple's notary service twice, for the app and for the disk image.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: brew install molten-vk vulkan-headers
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check the app
        run: |
          otool -L build/Unishade.app/Contents/MacOS/Unishade
          build/Unishade.app/Contents/MacOS/Unishade --version
      # The app promises macOS 13, which the runner's own version or a newer MoltenVK from Homebrew would quietly break.
      - name: Check the oldest macOS the app runs on
        run: |
          for binary in build/Unishade.app/Contents/MacOS/Unishade build/Unishade.app/Contents/Frameworks/libMoltenVK.dylib build/Depth.dylib; do
            vtool -show-build "$binary"
            vtool -show-build "$binary" | awk -v file="$binary" '
              $1 == "minos" { found = 1; split($2, v, "."); if (v[1] + 0 > 13 || (v[1] + 0 == 13 && v[2] + 0 > 0)) high = 1 }
              END { if (!found || high) { print file " needs a macOS newer than 13.0, or does not say which."; exit 1 } }'
          done
      # A manual run signs the app with the Developer ID Application certificate, so a Mac opens the download without a
      # warning and keeps the screen recording permission from one version to the next. The certificate is the
      # MACOS_CERTIFICATE secret, a .p12 file in base64, and MACOS_CERTIFICATE_PASSWORD its password.
      - name: Import the signing certificate
        id: certificate
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/mac-certificate
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      # The App Store Connect API key Apple's notary service takes, in a file only this user can read.
      - name: Write the notary key
        if: github.event_name == 'workflow_dispatch'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -z "$NOTARY_KEY" ]; then
            echo "::error::A manual run notarizes the Mac app, which needs the NOTARY_KEY and NOTARY_KEY_ID secrets, and NOTARY_ISSUER_ID for a team's key."
            exit 1
          fi
          (umask 077 && printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8")
      - name: Sign the app
        if: github.event_name == 'workflow_dispatch'
        env:
          IDENTITY: ${{ steps.certificate.outputs.identity }}
        run: cmake -DAPP=build/Unishade.app "-DIDENTITY=$IDENTITY" -P cmake/sign_macos.cmake
      # The app is notarized by itself first, so the copy in Applications has its ticket and opens with no network.
      - name: Notarize the app
        if: github.event_name == 'workflow_dispatch'
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/notarize-macos.sh build/Unishade.app
      # The disk image is what a release has for the Mac. Every run makes it, so a change that breaks it shows up here.
      - name: Package
        run: ./scripts/dmg.sh build/Unishade.app build/Unishade-macOS.dmg
      - name: Sign and notarize the disk image
        if: github.event_name == 'workflow_dispatch'
        env:
          IDENTITY: ${{ steps.certificate.outputs.identity }}
          NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          codesign --force --sign "$IDENTITY" --timestamp build/Unishade-macOS.dmg
          ./scripts/notarize-macos.sh build/Unishade-macOS.dmg
      # What a Mac that downloaded the release decides: Gatekeeper has to accept the disk image and the app in it as
      # notarized, and the app has to start from there.
      - name: Check the Mac accepts the disk image
        if: github.event_name == 'workflow_dispatch'
        run: |
          spctl --assess --type open --context context:primary-signature --verbose=2 build/Unishade-macOS.dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/image" build/Unishade-macOS.dmg
          codesign --verify --strict --deep --verbose=2 "$RUNNER_TEMP/image/Unishade.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/image/Unishade.app"
          xcrun stapler validate "$RUNNER_TEMP/image/Unishade.app"
          "$RUNNER_TEMP/image/Unishade.app/Contents/MacOS/Unishade" --version
          hdiutil detach "$RUNNER_TEMP/image"
      - name: Remove the signing certificate
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unishade-macOS
          path: |
            build/Unishade-macOS.dmg
            build/Depth.dylib
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [build, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Unishade-windows-x64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Unishade-linux-x64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Unishade-macOS
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: |
          mkdir upload
          # The add-ons the builds made stay out: each has releases of its own, which addon.yml publishes.
          cp release/build/Release/Unishade.exe "release/build/installer/Unishade-Setup-${RELEASE_TAG#v}.exe" release/LICENSE \
            release/Unishade-linux-x64.tar.gz release/Unishade-macOS.dmg upload/
          # The SHA-256 of every file, in the format sha256sum -c reads.
          (cd upload && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt upload/

          # The release creates its tag, so the newest tag here is the previous release's. A beta lists what changed
          # since the release before it, beta or not. A version lists what changed since the version before it, which
          # includes what its betas had.
          : > release-notes.md
          prerelease=()
          exclude=()
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            prerelease=(--prerelease)
            version=${RELEASE_TAG#v}
            version=${version%%-beta.*}
            printf '%s\n\n' "This is a beta of Unishade $version, for testing. Setup installs it over the Unishade you have. On Windows, the beta offers to install newer betas, and $version once it's released. On macOS and Linux it says when one is out. A beta's Setup isn't code-signed, so Windows may say **Windows protected your PC** before it runs. Click **More info**, then **Run anyway**. The Mac app is signed and notarized by Apple." > release-notes.md
          else
            exclude=(--exclude 'v*-beta.*')
          fi
          # The add-ons' releases have tags too, which start with the add-on's Id.
          previous_tag=$(git describe --tags --match 'v[0-9]*' "${exclude[@]}" --abbrev=0 HEAD 2>/dev/null || true)
          range=HEAD
          since=
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..HEAD"
            since=" since $previous_tag"
          fi
          # Only the commits that change what the release's files are made from: not the website, the bot, the
          # workflows, the tests, the scripts, the Markdown pages or the add-ons, whose own releases list theirs. The
          # add-on interface, addons/unishade_addon.h, is Unishade's. A long list is folded, so the page still starts
          # with what to know before downloading.
          git log --no-merges --format='- %s (%h)' "$range" -- . ':!website' ':!bot' ':!.github' ':!tests' ':!scripts' ':(exclude,glob)**/*.md' \
            ':(exclude,glob)addons/*/**' > changes.md
          count=$(wc -l < changes.md | tr -d ' ')
          if [ "$count" -gt 30 ]; then
            printf '<details>\n<summary>%s changes%s</summary>\n\n' "$count" "$since" >> release-notes.md
            cat changes.md >> release-notes.md
            printf '\n</details>\n' >> release-notes.md
          else
            cat changes.md >> release-notes.md
          fi
          cat >> release-notes.md <<'NOTES'

          SHA256SUMS.txt lists the SHA-256 of each file. To check a download, run `sha256sum -c SHA256SUMS.txt --ignore-missing` in the folder you downloaded to, or compare the output of `Get-FileHash <file>` in PowerShell, or `shasum -a 256 <file>` on a Mac.
          NOTES
          if [ ${#prerelease[@]} -eq 0 ]; then
            printf '\n%s\n' 'Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). [Code signing policy](https://unishade.me/code-signing/)' >> release-notes.md
          fi
          gh release create "$RELEASE_TAG" upload/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md "${prerelease[@]}"
      # Cloudflare builds the site from main, and a release changes nothing there. A release made with the workflow's token
      # doesn't start other workflows either, so the website workflow's release trigger doesn't fire. The deploy hook
      # asks Cloudflare to build the site again, to point its download buttons at the new files, or its banner at the
      # new beta.
      - name: Update the website
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::The CLOUDFLARE_DEPLOY_HOOK secret is not set, so Cloudflare was not asked to build the site."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_HOOK" > /dev/null
