name: Build and release

on:
  push:
    branches: ['**']
  pull_request:
  # Manual runs are signed by SignPath. With release on, they're signed with the release certificate and published as
  # the version in CMakeLists.txt. Otherwise they're signed with the test certificate, to try the signing.
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    # SignPath reads the run's jobs and downloads the unsigned files with the workflow's token.
    permissions:
      actions: read
      contents: read
    env:
      SIGNPATH_ORGANIZATION_ID: 163ddba1-cfa2-4731-ab5b-79be8ba21487
      SIGNPATH_PROJECT: Unishade
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # project(Unishade VERSION x.y.z) sets the version the files report and names the release. A release is checked
      # here, so a mistake fails before anyone is asked to approve the signing.
      - name: Read the version
        id: version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          version=$(sed -nE 's/.*project\(Unishade VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | sort -u)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" != true ]; then
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Raise project(Unishade VERSION $version) in CMakeLists.txt."
            exit 1
          fi
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # Setup embeds Unishade.exe and UnishadeUi.dll, so they're signed before Setup is built, and Setup after.
      - name: Upload the program for signing
        id: unsigned-program
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-program
          path: |
            build/Release/Unishade.exe
            build/Release/UnishadeUi.dll
          if-no-files-found: error
      - name: Sign the program
        if: github.event_name == 'workflow_dispatch'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.release && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-program.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          # Release signing waits for an approver.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/Release
      - name: Build installer
        run: cmake --build build --config Release --target installer
      # Building Setup must not have relinked them, or Setup would embed unsigned copies.
      - name: Check Setup embedded the signed program
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          foreach ($file in 'build/Release/Unishade.exe', 'build/Release/UnishadeUi.dll') {
            if (-not (Get-AuthenticodeSignature $file).SignerCertificate) { throw "$file isn't signed anymore." }
          }
      - name: Upload Setup for signing
        id: unsigned-setup
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-setup
          path: build/installer/Unishade-Setup-*.exe
          if-no-files-found: error
      - name: Sign Setup
        if: github.event_name == 'workflow_dispatch'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.release && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/installer
      # Installs into fresh folders under build/installer-tests with --portable, so nothing is registered on the runner.
      # It downloads ReShade and every effect package, and the presets from this commit, so a pull request that changes
      # a preset is tested with it.
      - name: Test installer
        timeout-minutes: 40
        shell: pwsh
        env:
          PRESETS_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/presets
        run: ./tests/installer_tests.ps1 -Setup (Get-Item build/installer/Unishade-Setup-*.exe).FullName -PresetsBaseUrl $env:PRESETS_URL
      - name: Upload the installer test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-test-logs
          path: build/installer-tests/**/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unishade-windows-x64
          path: |
            build/Release/Unishade.exe
            build/Release/UnishadeUi.dll
            build/installer/Unishade-Setup-*.exe
            LICENSE
          if-no-files-found: error

  # Built on the oldest supported runner, so the binary runs on older distributions too.
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev libx11-dev libxcomposite-dev libxext-dev libxres-dev libxdamage-dev \
            libxcb-dri3-dev libx11-xcb-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev mesa-vulkan-drivers
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Renders the repository's presets on Mesa's software Vulkan driver, with the packages they use.
      - name: Render presets
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/data
        run: |
          shaders="$XDG_DATA_HOME/unishade/reshade-shaders"
          mkdir -p "$shaders/Shaders" "$shaders/Textures"
          # Each package at a fixed commit, so a change upstream can't change the result.
          fetch() {
            git init --quiet "$RUNNER_TEMP/package"
            git -C "$RUNNER_TEMP/package" fetch --quiet --depth 1 "$1" "$3"
            git -C "$RUNNER_TEMP/package" checkout --quiet FETCH_HEAD
            mkdir -p "$shaders/Shaders/$2" "$shaders/Textures/$2"
            cp -r "$RUNNER_TEMP"/package/Shaders/. "$shaders/Shaders/$2"
            if [ -d "$RUNNER_TEMP/package/Textures" ]; then cp -r "$RUNNER_TEMP"/package/Textures/. "$shaders/Textures/$2"; fi
            rm -rf "$RUNNER_TEMP/package"
          }
          fetch https://github.com/crosire/reshade-shaders "" fd0022170615ce0d8162d219bff07232fa6dd84f # slim
          fetch https://github.com/crosire/reshade-shaders "" bcb5ba54199f4455026dd8ba66dc1b74461d3152 # legacy
          fetch https://github.com/CeeJayDK/SweetFX "" 93ddf39b357f5da534ed6d34ba4ec8cc7dcfa361 # master
          fetch https://github.com/luluco250/FXShaders FXShaders 76365e35c48e30170985ca371e67d8daf8eb9a98 # master
          fetch https://github.com/BlueSkyDefender/AstrayFX AstrayFX 59bae8b33e34f37a8e521e666864085ccbf08535 # master
          # A real game picture from the repository's own screenshots.
          for preset in presets/GenericPreset*.ini; do
            ./build/unishade --render assets/ReadmeShowcase1.jpg "$preset" "$(basename "$preset" .ini).png"
          done
          # Frames handed over on the graphics card, as zero-copy capture does, must come out the same as frames
          # copied through memory. These effects use no timer or randomness, so the results match exactly.
          printf 'Techniques=\n' > "$RUNNER_TEMP/copy.ini"
          printf 'Techniques=Curves@Curves.fx,LumaSharpen@LumaSharpen.fx,Vibrance@Vibrance.fx\n' > "$RUNNER_TEMP/fixed.ini"
          for preset in copy fixed; do
            ./build/unishade --render assets/ReadmeShowcase1.jpg "$RUNNER_TEMP/$preset.ini" "$RUNNER_TEMP/$preset-memory.png"
            ./build/unishade --render assets/ReadmeShowcase1.jpg "$RUNNER_TEMP/$preset.ini" "$RUNNER_TEMP/$preset-gpu.png" --gpu-source
            cmp "$RUNNER_TEMP/$preset-memory.png" "$RUNNER_TEMP/$preset-gpu.png"
          done
      - name: Package
        run: |
          mkdir -p package/Unishade
          cp build/unishade LICENSE src/posix/CREDITS.txt package/Unishade/
          tar -czf Unishade-linux-x64.tar.gz -C package Unishade
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unishade-linux-x64
          path: |
            Unishade-linux-x64.tar.gz
            GenericPreset*.png
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: brew install molten-vk vulkan-headers
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check the app
        run: |
          otool -L build/Unishade.app/Contents/MacOS/Unishade
          build/Unishade.app/Contents/MacOS/Unishade --version
      - name: Package
        run: |
          cp LICENSE src/posix/CREDITS.txt build/
          cd build
          ditto -c -k --keepParent Unishade.app Unishade-macOS.zip
          zip -j Unishade-macOS.zip LICENSE CREDITS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Unishade-macOS
          path: build/Unishade-macOS.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [build, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Unishade-windows-x64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Unishade-linux-x64
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Unishade-macOS
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: |
          mkdir upload
          cp release/build/Release/Unishade.exe release/build/Release/UnishadeUi.dll "release/build/installer/Unishade-Setup-${RELEASE_TAG#v}.exe" release/LICENSE \
            release/Unishade-linux-x64.tar.gz release/Unishade-macOS.zip upload/
          # The SHA-256 of every file, in the format sha256sum -c reads.
          (cd upload && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt upload/

          # The release creates its tag, so the newest tag here is the previous release's.
          previous_tag=$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)
          range=HEAD
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..HEAD"
          fi
          git log --format='- %s (%h)' "$range" > release-notes.md
          cat >> release-notes.md <<'NOTES'

          The macOS and Linux builds are experimental.

          SHA256SUMS.txt lists the SHA-256 of each file. To check a download, run `sha256sum -c SHA256SUMS.txt --ignore-missing` in the folder you downloaded to, or compare the output of `Get-FileHash <file>` in PowerShell, or `shasum -a 256 <file>` on a Mac.

          Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). [Code signing policy](https://unishade.me/code-signing/)
          NOTES
          gh release create "$RELEASE_TAG" upload/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md
      # Cloudflare builds the site from main, and a release changes nothing there. A release made with the workflow's token
      # doesn't start other workflows either, so the website workflow's release trigger doesn't fire. The deploy hook
      # asks Cloudflare to build the site again, to point its download buttons at the new files.
      - name: Update the website
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::The CLOUDFLARE_DEPLOY_HOOK secret is not set, so Cloudflare was not asked to build the site."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_HOOK" > /dev/null
