name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Target game
      description: The game and integration you were using.
      placeholder: Roblox
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Unishade version
      description: Shown in the Unishade window.
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Setup on Windows (Unishade-Setup.exe)
        - Unishade.exe on Windows, without Setup
        - The macOS app (Unishade-macOS.zip)
        - The Linux build (Unishade-linux-x64.tar.gz)
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and version
      description: On Windows, run `winver`. On macOS, see About This Mac. On Linux, name the distribution and say whether the desktop runs on X11 or Wayland.
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and driver version
  - type: textarea
    id: console
    attributes:
      label: Log
      description: Paste `Unishade.log`, which **Settings > About > Open log** opens. For problems with Setup on Windows, paste `%TEMP%\Unishade-Setup.log`.
      render: text
